buildscript {
    dependencies.add 'classpath', 'org.spongepowered:vanillagradle:0.2.1-20240507.024226-82'
}

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-20240507.024226-82'
    id "shared.conventions"
    alias(libs.plugins.mdg)
}

base {
    archivesName = "${mod_id}-common-${libs.versions.minecraft.release.get()}"
}

modsDotGroovy {
    multiplatform {
        gather {
            projectProperty("mod_id")
            projectProperty("mod_name")
            projectProperty("authors")
            projectProperty("at_enabled")
            projectProperty("common_mixin_enabled")
            projectProperty("fabric_mixin_enabled")
            projectProperty("forge_mixin_enabled")
        }
        expose()
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    testCompileOnly.extendsFrom(compileOnly)
}

minecraft {
    version(libs.versions.minecraft.release.get())
}

dependencies {
    runtimeOnly("com.github.llamalad7.mixinextras:mixinextras-common:0.2.0-beta.9")
    implementation("mysticdrew:common-networking-common:1.0.1-1.20.1")
    implementation("dev.dhyces.trimmed:trimmed-common-1.20.1:2.1.4")

    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.forEach {
        commonResources it
    }
}
