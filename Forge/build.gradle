import org.groovymc.modsdotgroovy.gradle.tasks.AbstractGatherPlatformDetailsTask

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id "consumer.conventions"
    alias(libs.plugins.mdg)
}

modsDotGroovy {
    platform(org.groovymc.modsdotgroovy.types.core.Platform.FORGE)
    inferGather.set(false)
    multiplatform {
        from(":Common")
    }
    apply()
}

tasks.named("gatherForgePlatformDetails", AbstractGatherPlatformDetailsTask).configure {
    minecraftVersion = libs.versions.minecraft.release
    platformVersion = libs.versions.forge.release
}

base {
    archivesName = "${mod_id}-forge-${libs.versions.minecraft.release.get()}-${mod_version}"
}

sourceSets {
    main
    datagen {
        compileClasspath = main.compileClasspath + main.output
        runtimeClasspath = main.runtimeClasspath + main.output
    }
}

minecraft {
    mappings channel: 'parchment', version: "${libs.versions.parchment.release.get()}-${libs.versions.parchment.minecraft.get()}"

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        client {
            mods {
                waxablecoral {
                    source sourceSets.main
                }
            }
        }

        server {
            mods {
                waxablecoral {
                    source sourceSets.main
                }
            }
        }

        data {
            args '--mod', 'waxablecoral', '--all', '--output', file("$rootDir/Common/src/generated/resources/"), '--existing', file("src/main/resources/")

            mods {
                waxablecoral {
                    source sourceSets.main
                    source sourceSets.datagen
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://maven.jaackson.me"
    }
}

dependencies {
    minecraft(libs.forge)

    runtimeOnly("com.github.llamalad7.mixinextras:mixinextras-forge:0.2.0-beta.9")
    implementation("mysticdrew:common-networking-forge:1.0.1-1.20.1")
    implementation fg.deobf("dev.dhyces.trimmed:trimmed-forge-1.20.1:2.1.4")

    implementation fg.deobf("com.teamabnormals:blueprint:1.20.1-7.1.0")
    // https://legacy.curseforge.com/minecraft/mc-mods/upgrade-aquatic/files
    implementation fg.deobf("curse.maven:upgradeaquatic-326895:5296565")
}

jar.finalizedBy('reobfJar')