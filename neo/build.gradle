plugins {
    id 'maven-publish'
    id "consumer.conventions"
    alias(libs.plugins.moddev)
    alias(libs.plugins.curseforgegradle)
    alias(libs.plugins.minotaur)
}

base {
    archivesName = "${mod_name}-neoforge-${libs.versions.minecraft.release.get()}"
}

sourceSets {
    datagen {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations {
    datagenCompile.extendsFrom compile
    datagenCompileClasspath.extendsFrom compileClasspath
}

neoForge {
    version = libs.neoforge.get().version

    def atFile = project(":common").file("src/main/resources/META-INF/accessTransformer.cfg")
    if (atFile.exists()) {
        accessTransformers.from(atFile)
    }

    parchment {
        minecraftVersion = libs.versions.parchment.minecraft.get()
        mappingsVersion = libs.versions.parchment.release.get()
    }

    mods {
        create("waxablecoral") {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }
    }

    runs {
        client {
            client()
            ideName = "Neo Client"
        }
        server {
            server()
            ideName = "Neo Server"
        }
        data {
            clientData()
            ideName = "Neo Data"

            sourceSet = sourceSets.datagen
            loadedMods = [mods.waxablecoral]

            programArguments = ['--mod', mod_id, '--all', '--output', rootProject.project(":common").file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath]
        }
    }
}

repositories {
    maven {
        name = 'Neo'
        url = 'https://maven.neoforged.net/releases'
    }
}


modrinth {
    projectId = modrinth_project_id
    versionName = "neoforge-${libs.versions.minecraft.release.get()}-${version}"
    versionNumber = "${libs.versions.minecraft.release.get()}-${version}+neoforge"
    versionType = publish_type
    uploadFile.set(tasks.jar)
    gameVersions = List.of(libs.versions.publish.range.get().split(","))
    loaders = List.of("neoforge")
    changelog = rootProject.file("changelog.md").text
    additionalFiles = List.of(tasks.named("sourcesJar"), tasks.named("javadocJar"))
    detectLoaders = false
    debugMode = publish_debug.toBoolean()
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = "publishing"

    disableVersionDetection()
    apiToken = findProperty("curseforge_publishing_token")
    def mainFile = upload(curseforge_project_id, tasks.jar)
    mainFile.displayName = "neoforge-${libs.versions.minecraft.release.get()}-${version}"
    mainFile.releaseType = publish_type
    mainFile.changelog = rootProject.file("changelog.md").text
    mainFile.changelogType = "markdown"
    mainFile.addModLoader("NeoForge")
    mainFile.addJavaVersion("Java ${java.toolchain.languageVersion.get()}")
    mainFile.addGameVersion(libs.versions.minecraft.release.get())
    debugMode = publish_debug.toBoolean()

    dependsOn(tasks.jar)
}
