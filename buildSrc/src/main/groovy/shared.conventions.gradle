plugins {
    id "java"
    id "maven-publish"
}

def versionCatalog = {
    extensions.getByType(VersionCatalogsExtension).named("libs")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : authors,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : libs.versions.minecraft.release.get()
        ])
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    compileOnly(versionCatalog().findLibrary("jetbrains.annotations").get())
    compileOnly(versionCatalog().findLibrary("jspecify").get())
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    repositories {
        maven {
            name = "Local"
            url  = findProperty("local_maven")
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
