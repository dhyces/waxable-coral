plugins {
    id "java"
    id "maven-publish"
}

def versionCatalog = {
    extensions.getByType(VersionCatalogsExtension).named("libs")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

version = properties["mod_version"] as String

tasks.jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${properties["mod_name"]}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : authors,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : libs.versions.minecraft.release.get()
        ])
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "Sponge / Mixin"
        url = uri("https://repo.spongepowered.org/repository/maven-public/")
    }
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/dhyces/trimmed")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
    maven { url = "https://jitpack.io/" }
    maven {
        url = "https://jm.gserv.me/repository/maven-public/"
    }
}

dependencies {
    compileOnly(versionCatalog().findLibrary("jetbrains.annotations").get())
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

if (hasProperty("publisher")) {
    publishing {
        repositories {
            maven {
                name = "Local"
                url  = uri("file://" + findProperty("local_maven"))
            }
        }
        publications {
            mavenJava(MavenPublication) {
                groupId project.group
                artifactId project.archivesBaseName
                version project.version
                from components.java
            }
        }
    }
}